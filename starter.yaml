schemaVersion: 1
id: starter-mobile-ionic
name: Starter Mobile Ionic

modes:
  standalone:
    overlay:
      path: modes/standalone/overlay
  module:
    placeholders:
      required:
        - PROJECT_NAME
        - PROJECT_SLUG
        - PROJECT_DESCRIPTION
        - CAPACITOR_APP_ID
        - CAPACITOR_APP_NAME
      - NODE_VERSION
      - JAVA_VERSION
      - XCODE_VERSION
      - ANDROID_BUILD_NUMBER_OFFSET
      - IOS_BUILD_NUMBER_OFFSET
        - NODE_VERSION
        - JAVA_VERSION
        - XCODE_VERSION
        - ANDROID_BUILD_NUMBER_OFFSET
        - IOS_BUILD_NUMBER_OFFSET
        - PNPM_VERSION
    requires:
      - workspace
      - nx
      - pnpm
    overlay:
      path: modes/module/overlay
defaultMode: standalone

template:
  path: template
  placeholders:
    required:
      - PROJECT_NAME
      - PROJECT_SLUG
      - PROJECT_DESCRIPTION
      - CAPACITOR_APP_ID
      - CAPACITOR_APP_NAME
